plugins { id 'com.android.application' }

android {
    namespace 'se.minaarbetspass'
    compileSdk 35

    signingConfigs {
        release {
            def signingFile = file("mina-arbetspass.jks")
            if (signingFile.exists()) {
                storeFile signingFile
                storePassword "android"
                keyAlias "mina-arbetspass"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "se.minaarbetspass"
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName "1.9.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
