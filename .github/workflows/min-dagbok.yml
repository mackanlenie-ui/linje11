name: Build Min Dagbok APK
on:
  workflow_dispatch:
  push:
    branches: [ min-dagbok ]
    paths:
      - 'min-dagbok/**'
      - '.github/workflows/min-dagbok.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: min-dagbok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Min-Dagbok-debug-APK
          path: min-dagbok/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
