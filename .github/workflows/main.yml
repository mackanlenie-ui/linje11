name: Bygg Mina arbetspass

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg APK
        run: gradle :app:assembleDebug
      - name: Döp APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mina-arbetspass.apk
      - name: Ladda upp byggarkiv
        uses: actions/upload-artifact@v4
        with:
          name: Mina-arbetspass-APK
          path: Mina-arbetspass.apk
      - name: Publicera direkt APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mina-arbetspass-v1.6
          name: Mina arbetspass 1.6
          body: Installerbar APK för Mina arbetspass.
          files: Mina-arbetspass.apk
