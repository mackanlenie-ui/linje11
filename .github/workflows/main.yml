name: Bygg Mina arbetspass

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_SECRET: ${{ secrets.ANDROID_SIGNING_SECRET }}
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testa och kontrollbygg appen
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Signeringsnyckel saknas
        if: ${{ env.SIGNING_SECRET == '' }}
        run: |
          echo "Ingen release publiceras förrän ANDROID_SIGNING_SECRET är konfigurerad."
          echo "Detta förhindrar att en APK med ny slumpmässig debug-nyckel råkar distribueras."

      - name: Dekryptera permanent signeringsnyckel
        if: ${{ env.SIGNING_SECRET != '' }}
        run: |
          base64 --decode signing/mina-arbetspass.jks.enc.b64 > /tmp/mina-arbetspass.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/mina-arbetspass.jks.enc \
            -out app/mina-arbetspass.jks \
            -pass env:SIGNING_SECRET

      - name: Bygg permanent signerad APK
        if: ${{ env.SIGNING_SECRET != '' }}
        run: gradle :app:assembleRelease

      - name: Döp APK
        if: ${{ env.SIGNING_SECRET != '' }}
        run: cp app/build/outputs/apk/release/app-release.apk Mina-arbetspass.apk

      - name: Kontrollera permanent signering
        if: ${{ env.SIGNING_SECRET != '' }}
        run: scripts/verify-apk-signer.sh Mina-arbetspass.apk

      - name: Ta bort dekrypterad nyckel
        if: ${{ always() }}
        run: rm -f app/mina-arbetspass.jks /tmp/mina-arbetspass.jks.enc

      - name: Ladda upp byggarkiv
        if: ${{ env.SIGNING_SECRET != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Mina-arbetspass-APK
          path: Mina-arbetspass.apk

      - name: Publicera direkt APK
        if: ${{ env.SIGNING_SECRET != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mina-arbetspass-v1.13
          name: Mina arbetspass 1.13
          body: Mina arbetspass 1.13 med smartare fotoimport, redigering före sparning, osäkra rader, bättre dubblettskydd och ångra senaste fotoimport.
          files: Mina-arbetspass.apk
