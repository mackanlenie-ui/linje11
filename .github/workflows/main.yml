name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply Rutt GPS Version 77
        run: python3 scripts/version77.py
      - name: Build both apps
        run: gradle :app:assembleDebug :facebookapp:assembleDebug
      - name: Upload Rutt GPS APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutt-GPS-Version77
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload separate Facebook Firefox APK
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Firefox
          path: facebookapp/build/outputs/apk/debug/facebookapp-debug.apk
