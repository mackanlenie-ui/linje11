name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle Leaflet locally
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o app/src/main/assets/leaflet.js
          curl -L --fail --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o app/src/main/assets/leaflet.css
      - name: Apply Version 21
        run: python3 scripts/version21.py
      - name: Build APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rutt-GPS-Version21
          path: app/build/outputs/apk/debug/app-debug.apk
