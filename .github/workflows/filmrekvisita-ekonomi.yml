name: Bygg Filmrekvisita Ekonomi
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "filmrekvisita-ekonomi/**"
      - ".github/workflows/filmrekvisita-ekonomi.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bygg APK
        run: |
          cd filmrekvisita-ekonomi
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Filmrekvisita-Ekonomi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Filmrekvisita-Ekonomi-APK
          path: Filmrekvisita-Ekonomi.apk
