name: Bygg Nordia
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "filmrekvisita-ekonomi/**"
      - ".github/workflows/filmrekvisita-ekonomi.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_SECRET: ${{ secrets.ANDROID_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Dekryptera permanent signeringsnyckel
        if: ${{ env.SIGNING_SECRET != '' }}
        run: |
          base64 --decode signing/mina-arbetspass.jks.enc.b64 > /tmp/nordia.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/nordia.jks.enc \
            -out filmrekvisita-ekonomi/app/nordia.jks \
            -pass env:SIGNING_SECRET
      - name: Bygg signerad Nordia APK
        if: ${{ env.SIGNING_SECRET != '' }}
        run: |
          cd filmrekvisita-ekonomi
          gradle :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Nordia.apk
      - name: Bygg debug om signeringsnyckel saknas
        if: ${{ env.SIGNING_SECRET == '' }}
        run: |
          cd filmrekvisita-ekonomi
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Nordia.apk
      - name: Ta bort dekrypterad nyckel
        if: ${{ always() }}
        run: rm -f filmrekvisita-ekonomi/app/nordia.jks /tmp/nordia.jks.enc
      - uses: actions/upload-artifact@v4
        with:
          name: Nordia-APK
          path: Nordia.apk
